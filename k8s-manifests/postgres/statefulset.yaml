apiVersion: apps/v1
kind: StatefulSet
Metadata:
  name: postgress
  namespace: banking

spec:
  serviceName: postgres-service
  replica: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-node-2
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            -secretRef:
              name: postgres-secret
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgres/data
          redinessProde:
            exec:
              command: ["pg_isready", "-U", "banking_user", "-d", "bankingdb"]
            initialDelaySeconds: 10
            periodSeconds: 5

  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi